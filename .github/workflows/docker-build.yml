name: Build and push Docker image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CACHE_IMAGE: docker.io/yeloh/weather-app-cache

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the source repo
        uses: actions/checkout@v6

      - name: QEMU set-up
        uses: docker/setup-qemu-action@v4

      - name: Buildx set-up
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata definitions
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: temp-image:scan
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:cache

      - name: Scan CVE
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: temp-image:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Build and push Docker image
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:cache,mode=max